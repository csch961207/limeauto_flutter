<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>跳转SnowStormPlus应用</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f5f5f5;
        }
        .container {
            text-align: center;
        }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            background-color: #4285f4;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            transition: background-color 0.3s;
        }
        .btn:hover {
            background-color: #3367d6;
        }
        .fallback {
            margin-top: 20px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>SnowStormPlus</h1>
        <a id="openAppBtn" href="snowstormplusscheme://" class="btn">打开应用</a>
        
        <div id="fallback" class="fallback" style="display: none;">
            <p>未检测到应用，是否前往下载页面？</p>
            <a href="https://your-download-page.com" class="btn">前往下载</a>
        </div>
    </div>

    <script>
        document.getElementById('openAppBtn').addEventListener('click', function(e) {
            e.preventDefault();
            
            // 尝试打开App
            window.location.href = 'snowstormplusschemes://';
            
            // 如果App未安装，设置回退逻辑
            setTimeout(function() {
                if (!document.hidden) {
                    document.getElementById('fallback').style.display = 'block';
                }
            }, 1000);
        });
        
        // 监听页面可见性变化（适用于iOS）
        document.addEventListener('visibilitychange', function() {
            if (document.hidden) {
                // 如果页面隐藏了，说明跳转成功
                document.getElementById('fallback').style.display = 'none';
            }
        });
    </script>
</body>
</html>
